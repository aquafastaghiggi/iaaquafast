# ============================================================
#  AQUAFAST — Stack de IA local para análise Scanntech
#  Windows 11 · CPU only · Docker Desktop
# ============================================================
#
#  Serviços:
#   - Ollama        → motor de IA local (porta 11434)
#   - Open WebUI    → interface de chat (porta 3000)
#   - Metabase      → dashboards visuais (porta 3001)
#   - PostgreSQL    → banco do Metabase (interno)
#
#  Uso:
#   docker compose up -d
#   Aguardar ~2 min e acessar http://localhost:3000
# ============================================================

services:

  # ----------------------------------------------------------
  #  OLLAMA — motor de IA rodando localmente
  #  Sem GPU: usa CPU automaticamente
  # ----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: aquafast_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama        # modelos ficam salvos aqui
    environment:
      - OLLAMA_NUM_PARALLEL=1            # 1 requisição por vez (CPU)
      - OLLAMA_MAX_LOADED_MODELS=1       # 1 modelo na memória
      - OLLAMA_KEEP_ALIVE=5m             # descarrega modelo após 5min ocioso
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  #  OPEN WEBUI — interface de chat estilo ChatGPT
  #  Acesso: http://localhost:3000
  # ----------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: aquafast_webui
    ports:
      - "3000:8080"
    volumes:
      - webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      # Leave model filtering disabled until scripts/doctor_openwebui.py reports OK.
      # - ENABLE_MODEL_FILTER=true
      # - MODEL_FILTER_LIST=ceb51b31-8ecd-401c-b0cb-677a7f0d8ebc.scanntech_analyst
      - WEBUI_SECRET_KEY=aquafast_secret_2026   # troque por uma chave segura
      - WEBUI_NAME=Aquafast IA                  # nome que aparece na interface
      # Padrão de trabalho do projeto: manter Scanntech Analyst como porta de entrada.
      # Observacao: para Pipes/Functions, o Open WebUI usa o id completo "<function_id>.<pipe_id>".
      - DEFAULT_MODELS=ceb51b31-8ecd-401c-b0cb-677a7f0d8ebc.scanntech_analyst
      - DEFAULT_PINNED_MODELS=ceb51b31-8ecd-401c-b0cb-677a7f0d8ebc.scanntech_analyst
      - DEFAULT_PROMPT_SUGGESTIONS=[{"title":["Quantas lojas a Aquafast tem hoje?"],"content":"Quantas lojas a Aquafast tem hoje?"},{"title":["Em quantos pontos de venda a Aquafast está presente hoje?"],"content":"Em quantos pontos de venda a Aquafast está presente hoje?"},{"title":["Qual o maior concorrente da Aquafast?"],"content":"Qual o maior concorrente da Aquafast?"},{"title":["Quais produtos teriam mais potencial de venda?"],"content":"Quais produtos teriam mais potencial de venda?"},{"title":["Top 20 produtos mais vendidos"],"content":"Top 20 produtos Aquafast por caixa"},{"title":["Top 20 clientes por valor"],"content":"Top 20 clientes Aquafast por caixa"},{"title":["Vendas por mês"],"content":"Mostre as vendas da Aquafast por mês"},{"title":["Vendas por estado"],"content":"Mostre as vendas da Aquafast por estado"}]
      - ENABLE_SIGNUP=true                      # permite o primeiro cadastro
      - DEFAULT_USER_ROLE=user
    depends_on:
      ollama:
        condition: service_healthy
      scanntech-api:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------
  #  SCANNTECH API — consulta deterministica ao DuckDB local
  #  Acesso interno no compose: http://scanntech-api:8000
  # ----------------------------------------------------------
  scanntech-api:
    build:
      context: .
      dockerfile: Dockerfile.scanntech-api
    container_name: aquafast_scanntech_api
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - AQUAFAST_MYSQL_HOST=${AQUAFAST_MYSQL_HOST:-host.docker.internal}
      - AQUAFAST_MYSQL_PORT=${AQUAFAST_MYSQL_PORT:-3306}
      - AQUAFAST_MYSQL_USER=${AQUAFAST_MYSQL_USER:?set AQUAFAST_MYSQL_USER in .env}
      - AQUAFAST_MYSQL_PASSWORD=${AQUAFAST_MYSQL_PASSWORD:?set AQUAFAST_MYSQL_PASSWORD in .env}
      - AQUAFAST_MYSQL_DATABASE=${AQUAFAST_MYSQL_DATABASE:?set AQUAFAST_MYSQL_DATABASE in .env}
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 15s
      timeout: 10s
      retries: 10

  # ----------------------------------------------------------
  #  METABASE — dashboards e gráficos visuais
  #  Acesso: http://localhost:3001
  # ----------------------------------------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: aquafast_metabase
    ports:
      - "3001:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=metabase
      - MB_DB_PASS=metabase_pass_2026
      - MB_DB_HOST=postgres
      - JAVA_TIMEZONE=America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------
  #  POSTGRESQL — banco interno do Metabase
  #  (não é o banco dos dados Scanntech — é só pra o Metabase)
  # ----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: aquafast_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=metabase
      - POSTGRES_USER=metabase
      - POSTGRES_PASSWORD=metabase_pass_2026
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 5

# ----------------------------------------------------------
#  VOLUMES persistentes — dados ficam salvos entre reinicializações
# ----------------------------------------------------------
volumes:
  ollama_data:
  webui_data:
  postgres_data:
  metabase_data:
